<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Bookmarks</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23666'/%3E%3Ctext x='50' y='60' font-size='50' text-anchor='middle' fill='white'%3E★%3C/text%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-gray-100">
    <main class="max-w-5xl mx-auto p-6">
      <header class="flex justify-between items-center mb-5">
        <h1 class="text-2xl font-bold tracking-wide">Bookmarks</h1>
        <input id="search" type="search" placeholder="Search… (title, url)" aria-label="Search bookmarks" class="w-72 px-3 py-2.5 bg-gray-800/50 text-gray-100 border border-gray-600 rounded-lg outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400/30 placeholder-gray-400" />
      </header>

      <section id="grid" class="flex flex-wrap gap-4" aria-live="polite"></section>
    </main>

    <script src="./bookmarks.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
